<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIA 精英領袖 - 職業規劃系統</title>
    <!-- CSS 樣式與原版一致，已包含版本更新與新導航的樣式 -->
    <style>
        :root { --primary: #d31145; --bg: #f4f6f9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; text-align: center; padding: 15px; font-weight: bold; }
        .app-nav { display: flex; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-btn { flex: 1; padding: 12px 5px; text-align: center; font-weight: bold; color: #888; font-size: 0.85rem; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .container { padding: 15px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .update-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .update-box { background: white; padding: 25px; border-radius: 16px; text-align: center; width: 80%; }
    </style>
</head>
<body>

<!-- 更新提示層 -->
<div id="update-overlay" class="update-overlay">
    <div class="update-box">
        <h2>🚀 發現新版本</h2>
        <p>系統已更新保費智能連動與產業趨勢數據，請立即更新。</p>
        <button onclick="forceUpdateApp()" style="padding: 10px 20px; background: #d31145; color: white; border: none; border-radius: 5px;">立即更新</button>
    </div>
</div>

<header>AIA 精英領袖</header>

<!-- 第一層導航 -->
<div class="app-nav">
    <div class="nav-btn active" id="nav-calc" onclick="switchTab('calc')">💰 收入計算</div>
    <div class="nav-btn" id="nav-info" onclick="switchTab('info')">🤝 入職福利</div>
    <div class="nav-btn" id="nav-cond" onclick="switchTab('cond')">📝 達標條件</div>
</div>

<!-- 第二層導航 -->
<div class="app-nav" style="border-top: 1px solid #eee;">
    <div class="nav-btn" id="nav-ind1" onclick="switchIndustry('ind1')">🚀 科技創新</div>
    <div class="nav-btn" id="nav-ind2" onclick="switchIndustry('ind2')">💰 金融專業</div>
    <div class="nav-btn" id="nav-ind3" onclick="switchIndustry('ind3')">🏥 醫療基建</div>
</div>

<div class="container">
    <!-- 內容區塊省略，與前述結構一致 -->
    <div id="view-calc" class="view-section active">...</div>
    <div id="view-info" class="view-section">...</div>
    <div id="view-ind1" class="view-section">...</div>
    
    <div id="app-version-display" style="text-align:center; color:#aaa; margin-top:20px;"></div>
</div>

<script>
    // 版本控制邏輯[span_3](start_span)[span_3](end_span)
    const APP_VERSION = "v1.1.0"; 
    document.getElementById('app-version-display').innerText = "版本號: " + APP_VERSION;

    // 產業切換邏輯[span_4](start_span)[span_4](end_span)
    function switchIndustry(tabId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-' + tabId).classList.add('active');
    }

    // Service Worker 更新邏輯[span_5](start_span)[span_5](end_span)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed') {
                        document.getElementById('update-overlay').style.display = 'flex';
                    }
                });
            });
        });
    }

    function forceUpdateApp() {
        window.location.reload(true);
    }
</script>
</body>
</html>
