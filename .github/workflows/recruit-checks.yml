name: Recruit checks
on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'design-system/**'
      - 'tests/**'
      - '.github/workflows/recruit-checks.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check recruit-content.js
          node --check recruit-engine.js
      - name: Regression suite
        run: node --test tests/recruit-engine.test.js tests/static-contract.test.js tests/package-presentation.test.js tests/ava-ui-contract.test.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser rendered responsive and journey smoke
        run: node --test tests/ui-smoke.test.js
