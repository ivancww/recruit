<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="description" content="AVA Recruit — Career Discovery & Recruitment Conversation System">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/components.css">
  <link rel="stylesheet" href="ava-recruit-ui.css">
  <title>AVA Recruit</title>
</head>
<body class="ava-front" data-ava-mode="use">
  <div id="updateBanner" class="update-banner" hidden><span>新版本已準備好。</span><button id="updateButton">立即更新</button></div>
  <header class="app-header ava-header">
    <div class="brand"><span class="brand-mark">A</span><div><strong id="brandName">AVA Recruit</strong><small>Career Discovery · <span id="headerVersion">v2.1.2</span></small></div></div>
    <div class="header-actions"><a class="mode-button ava-return ava-button ava-button--secondary" id="avaReturnButton" href="https://ivancww.github.io/avaplatform/"><svg class="ava-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M5 12h14"/></svg><span>返回 AVA</span></a><button class="mode-button" id="modeButton">Recruiter Mode</button><button class="icon-button" id="sessionsButton" aria-label="候選人進度"><svg class="ava-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="icon-button" id="settingsButton" aria-label="設定"><svg class="ava-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/><circle cx="12" cy="12" r="4"/></svg></button></div>
  </header>
  <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
  <main id="flowShell" class="flow-shell ava-container"></main>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="sessionDrawer" aria-hidden="true"><div class="drawer-head"><div><span class="eyebrow">LOCAL SESSIONS</span><h2>候選人進度</h2></div><button class="icon-button drawer-close" aria-label="關閉"><svg class="ava-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><button class="primary-button full" id="addSessionButton">＋ 新增 Session</button><div id="sessionList" class="session-list"></div></aside>
  <aside class="drawer" id="settingsDrawer" aria-hidden="true"><div class="drawer-head"><div><span class="eyebrow">USER / ADMIN</span><h2>Recruit 設定</h2></div><button class="icon-button drawer-close" aria-label="關閉"><svg class="ava-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="settings-tabs"><button class="active" data-settings-tab="user">User</button><button data-settings-tab="admin">Admin</button></div><div id="userSettings"><p>個人設定只影響呢部裝置，不會修改 Cloud Master Data。</p><label>主題名稱<input id="themeNameInput" maxlength="60"></label><label>預設模式<select id="defaultModeInput"><option value="recruiter">Recruiter Mode</option><option value="candidate">Candidate Mode</option></select></label><button class="primary-button full" id="saveUserSettings">保存個人設定</button><button class="secondary-button full" id="exportButton">匯出 Sessions 備份</button><label class="secondary-button full file-button">匯入 Sessions 備份<input type="file" id="importInput" accept="application/json"></label><button class="danger-button full" id="resetUserSettings">恢復系統預設</button></div><div id="adminSettings" hidden><p>Admin 管理系統預設內容；本版本不自行建立 Backend。正式 Cloud Master Data 接入前，修改只作本機預覽。</p><label>Admin Access Code<input id="adminCodeInput" type="password" autocomplete="off"></label><button class="primary-button full" id="unlockAdminButton">解鎖 Admin 預覽</button><div id="adminEditor" hidden><label>核心語氣<textarea id="adminCopyInput" rows="4"></textarea></label><label>內容版本<input id="contentVersionInput"></label><button class="primary-button full" id="saveAdminPreview">保存本機 Admin 預覽</button><div class="admin-note">Package、Benefit、Qualification 同計算公式受保護；此編輯器不會修改 Engine。</div></div></div><div class="version-line">AVA Recruit · <span id="versionText"></span></div></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="recruit-content.js"></script><script src="recruit-engine.js"></script><script src="recruit-cloud.js"></script><script src="recruit-user-edit.js"></script><script src="recruit-admin.js"></script><script src="recruit-releases.js"></script><script src="app.js"></script>
</body>
</html>
